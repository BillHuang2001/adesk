# adesk-client — async Rust SDK for the ADesk Agent GUI Protocol (AGP).
#
# Dependency versions are declared once in the root workspace manifest
# (`[workspace.dependencies]`); this crate only references them so versions can
# never drift. `adesk-client` is a pure client: it never links Smithay and never
# touches the compositor — it speaks NDJSON over a Unix socket (docs/protocol.md).
[package]
name = "adesk-client"
description = "Async Rust client SDK for the ADesk Agent GUI Protocol (AGP)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
adesk-core.workspace = true
adesk-proto.workspace = true
base64.workspace = true
futures.workspace = true
image.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true

[dev-dependencies]
tempfile.workspace = true
