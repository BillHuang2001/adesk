[package]
name = "adesk-notify"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "ADesk notification store and agent event inbox"

[dependencies]
adesk-core.workspace = true
tokio.workspace = true
thiserror.workspace = true
tracing.workspace = true

[dev-dependencies]
# `test-util` enables `tokio::time::pause()` / `#[tokio::test(start_paused = true)]`,
# which the deterministic `wait_for_events` timeout tests require. Feature-only
# addition: the version still comes from the root manifest.
tokio = { workspace = true, features = ["test-util"] }
