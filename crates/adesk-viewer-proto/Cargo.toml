# adesk-viewer-proto — the ADesk Viewer Attachment Protocol (VAP) v1 wire types and codec.
#
# Dependency versions are declared once in the root workspace manifest
# ([workspace.dependencies]); this crate only references them so versions can
# never drift. Pure serialization: no I/O, no async, no tokio, no Smithay — the
# transport is deliberately separate (docs/viewer.md).
[package]
name = "adesk-viewer-proto"
description = "Wire protocol for the ADesk Viewer Attachment Protocol (VAP): frames, messages and NDJSON codec."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
adesk-core.workspace = true
adesk-proto.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
