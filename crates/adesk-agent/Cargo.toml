# adesk-agent — multimodal GUI agent prototype.
#
# The ADesk runtime's primary client: a provider-agnostic LLM decision loop over
# the Agent GUI Protocol (AGP). Every third-party version is declared once in the
# root workspace manifest ([workspace.dependencies]); this crate only references
# them so versions can never drift.
[package]
name = "adesk-agent"
description = "ADesk multimodal GUI agent prototype: provider-agnostic LLM loop over AGP."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "adesk_agent"
path = "src/lib.rs"

[[bin]]
name = "adesk-agent"
path = "src/main.rs"

# Explicit targets for the feature-gated suites, mirroring the `[[example]]` below:
# without `required-features` Cargo compiles, links and runs a 0-test binary for each
# of them in every other configuration. `tests/context_budget.rs` and `tests/metrics.rs`
# are ungated and stay auto-discovered.

[[test]]
name = "agent_loop"
path = "tests/agent_loop.rs"
required-features = ["test-support"]

[[test]]
name = "scenarios"
path = "tests/scenarios.rs"
required-features = ["test-support"]

[[test]]
name = "dummy_provider"
path = "tests/dummy_provider.rs"
required-features = ["test-support"]

[[test]]
name = "watch"
path = "tests/watch.rs"
required-features = ["test-support"]
[[test]]
name = "e2e_runtime"
path = "tests/e2e_runtime.rs"
required-features = ["e2e"]

# Fixture application for the `e2e` suite: the launch tests write a `.desktop` entry whose
# `Exec` points at this example (an example, not a bin, because examples are built together
# with this package's dev-dependencies and are resolved next to the test binary by
# `tests/e2e_support/mod.rs`). Gated on `e2e` so the default and `test-support` builds
# never compile it.

[[example]]
name = "adesk-e2e-app"
path = "examples/adesk-e2e-app.rs"
required-features = ["e2e"]

[features]
default = []
# Compiles `adesk_agent::testing` (ScriptedClient), the socket-free fake used by
# this crate's own tests. Canonical test command:
#   cargo test -p adesk-agent --features test-support
test-support = []
# Gates end-to-end tests that drive a real runtime through `adesk-testkit`.
# Canonical command:
#   cargo test -p adesk-agent --features e2e
e2e = []

[dependencies]
adesk-core.workspace = true
adesk-proto.workspace = true
adesk-client.workspace = true
async-trait.workspace = true
clap.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
anyhow.workspace = true

[dev-dependencies]
# Real in-process runtime harness (compositor + AGP server) for `--features e2e`.
# `image` decodes the PNG payloads the runtime returns in e2e assertions.
adesk-testkit.workspace = true
image.workspace = true
