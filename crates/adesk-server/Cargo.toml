# adesk-server — the ADesk runtime binary and AGP server.
#
# Composes every other crate: starts the compositor thread, binds the AGP Unix
# socket, pumps RuntimeEvents into the observer and the subscription fan-out,
# and dispatches every AGP v1 method (docs/protocol.md §5). Dependency versions
# are declared once in the root workspace manifest ([workspace.dependencies]);
# this crate only references them so versions can never drift.
[package]
name = "adesk-server"
description = "ADesk runtime binary and AGP server: composes the compositor, observer, app registry and inspector behind a Unix socket."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "adesk_server"
path = "src/lib.rs"

[[bin]]
name = "adesk-server"
path = "src/main.rs"

[dependencies]
adesk-core.workspace = true
adesk-proto.workspace = true
adesk-compositor.workspace = true
adesk-observer.workspace = true
adesk-app-registry.workspace = true
adesk-inspector.workspace = true
adesk-render.workspace = true
# VAP v1 wire types (`adesk-viewer-proto`) and the viewer server session +
# `ViewerBackend` seam (`adesk-viewer`): the viewer endpoint (`src/viewer/`)
# implements the trait and hands it to `ViewerServer::serve`; the runtime never
# reimplements protocol or session logic.
adesk-viewer-proto.workspace = true
adesk-viewer.workspace = true
# Screen recording (encoder + muxer), driven by the viewer endpoint's recording
# backend (`src/viewer/backend.rs`). Referenced by path because the crate is a
# workspace member (`crates/*`); it carries no version, so the "versions live in
# the root [workspace.dependencies]" rule is untouched.
adesk-recorder = { path = "../adesk-recorder" }
async-trait.workspace = true
anyhow.workspace = true
clap.workspace = true
image.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
# E2E suites in ./tests/ drive a live runtime through the typed client SDK on
# temp sockets; wire-only AGP cases use the suites' own NDJSON `RawClient`. The
# viewer suite polls the typed `adesk_viewer::ViewerClient` streams (frames,
# input acks), so it is the one place that needs `futures`.
# `adesk-testkit` is a dev-dependency so the viewer suite can connect the
# in-repo Wayland test client to the runtime's own display and drive real
# viewer input into a mapped toplevel (the same dev-dependency cycle
# `crates/adesk-compositor` already uses) — see ./tests/CONTEXT.md.
adesk-client.workspace = true
adesk-testkit.workspace = true
futures.workspace = true
tempfile.workspace = true
