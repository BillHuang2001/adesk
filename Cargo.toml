# ADesk — AI-native headless Wayland runtime (workspace manifest)
#
# This is a pure virtual workspace. Every crate under ./crates/ is a workspace
# member. All third-party dependency versions MUST be declared here in
# [workspace.dependencies]; member crates reference them with
# `<dep>.workspace = true` so versions can never drift between crates.
[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
license = "MIT OR Apache-2.0"
repository = "https://example.invalid/adesk"

[workspace.dependencies]
# --- internal crates ---
adesk-core = { path = "crates/adesk-core" }
adesk-proto = { path = "crates/adesk-proto" }
adesk-app-registry = { path = "crates/adesk-app-registry" }
adesk-wm = { path = "crates/adesk-wm" }
adesk-observer = { path = "crates/adesk-observer" }
adesk-notify = { path = "crates/adesk-notify" }
adesk-render = { path = "crates/adesk-render" }
adesk-compositor = { path = "crates/adesk-compositor" }
adesk-inspector = { path = "crates/adesk-inspector" }
adesk-client = { path = "crates/adesk-client" }
adesk-server = { path = "crates/adesk-server" }
adesk-agent = { path = "crates/adesk-agent" }
adesk-testkit = { path = "crates/adesk-testkit" }
adesk-viewer-proto = { path = "crates/adesk-viewer-proto" }
adesk-viewer = { path = "crates/adesk-viewer" }
adesk-viewer-gui = { path = "crates/adesk-viewer-gui" }
adesk-machine = { path = "crates/adesk-machine" }
adesk-recorder = { path = "crates/adesk-recorder" }

# --- wayland / smithay stack ---
smithay = { version = "0.7.0", default-features = false }
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["server", "client", "staging", "unstable"] }
calloop = "0.14"
calloop-wayland-source = "0.3"

# --- async / runtime ---
tokio = { version = "1", features = ["rt-multi-thread", "net", "sync", "time", "io-util", "macros", "signal", "process"] }
futures = "0.3"
async-trait = "0.1"

# --- serialization / protocol ---
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"

# --- errors / logging / cli ---
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
clap = { version = "4", features = ["derive", "env"] }

# --- imaging / misc ---
image = { version = "0.25", default-features = false, features = ["png"] }
# Pure-Rust baseline JPEG encoder: the software screen-recording backend encodes
# Motion-JPEG frames with it (no C toolchain, no system libraries).
jpeg-encoder = "0.7"
# Pure-Rust JPEG decoder: used only by `adesk-recorder`'s dev-dependencies to
# round-trip-verify the Motion-JPEG frames it emits.
jpeg-decoder = "0.3"
tempfile = "3"
bitflags = "2"
# Safe pipe creation (OwnedFd pairs) for the testkit data-device helpers; keeps
# `adesk-testkit`'s `#![forbid(unsafe_code)]` intact without raising the MSRV.
rustix = { version = "1", features = ["pipe"] }

# --- agent LLM providers ---
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }

# --- GTK4/libadwaita viewer front-end (`adesk-viewer-gui`) ---
# Only the GUI crate uses these; the headless runtime/server crates never do.
gtk4 = "0.11"
# libadwaita 0.9 renamed its library target to `libadwaita`; alias it back to the
# conventional `adw` crate name so `use adw::prelude::*` works.
adw = { package = "libadwaita", version = "0.9" }

[profile.release]
debug = 1
